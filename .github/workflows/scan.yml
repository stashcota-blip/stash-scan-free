name: STASH SCAN FREE Telegram

on:
  schedule:
    - cron: '2-59/5 * * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stash-scan-free
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Packages
        run: pip install -r requirements.txt
      - name: Tests
        run: python -m pytest -q
      - name: Run bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python telegram_bot.py
      - name: Save state
        run: |
          if ! git diff --quiet -- bot_state.json; then
            git config user.name 'stash-scan[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add bot_state.json
            git commit -m 'bot: update signal state [skip ci]'
            git push
          fi
